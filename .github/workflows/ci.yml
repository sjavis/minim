name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mpi4py/setup-mpi@v1
      - run: make
      - run: make check

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Requirements
        run: sudo apt install doxygen
              && pip3 install -r doc/requirements.txt
      - name: Build docs
        run: cd doc
              && make html
              && cd _build/html
              && touch .nojekyll
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: doc/_build/html # The folder the action should deploy.
